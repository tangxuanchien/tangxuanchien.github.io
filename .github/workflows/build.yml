name: Build site

# Runs when app data, images or the generator change (including saves from Pages CMS),
# every day to pick up Google Play listing changes, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install google-play-scraper==1.2.7 pillow

      - name: Pull Google Play data for live apps
        run: python tools/fetch_store.py
        continue-on-error: true

      - name: Generate HTML
        run: python tools/build.py

      - name: Commit generated pages
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Rebuild site"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own, so ask for one.
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
